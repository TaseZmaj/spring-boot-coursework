<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <title>national park List</title>
</head>
<body>

<div>
    <!-- The form below should invoke the method NationalParkController.listAll -->
    <form id="filter-form" method="GET" action="/national-parks">
        <label for="name">National Park Name</label>
        <input id="name" type="text" name="name"/>

        <label for="areaSize">National Park Area Size (in square meters)</label>
        <input id="areaSize" type="number" name="areaSize"/>

        <label for="rating">Rating</label>
        <input id="rating" type="number" step="0.1" min="0" max="10" name="rating"/>

        <label for="parkType">National Park Type</label>
        <select id="parkType" name="parkType">
            <option value="">All</option>
            <!-- For each ParkType you should have one <option> like below  -->
            <option th:each="pt : ${parkTypes}"
                    th:value="${pt}"
                    th:text="${pt}">
            </option>
        </select>

        <label for="location">ParkLocation</label>
        <select id="location" name="locationId">
            <option value="">All</option>
            <!-- For each location you should have one <option> like below  -->
<!--            <option>[location.country], [location.continent]</option>-->
            <option th:each="pl : ${locations}"
                    th:value="${pl.getId()}"
                    th:text="${pl.getCountry()} + ' ' + ${pl.getContinent()}">
            </option>

        </select>

        <button id="filter" type="submit">Filter</button>
    </form>

    <div>
        <!-- NationalParkController.showAdd -->
        <a href="/national-parks/add" class="add-item" sec:authorize="hasRole('ROLE_ADMIN')">Add new national park</a>
    </div>

    <table>
        <tr>
            <th>National Park</th>
            <th>Area Size</th>
            <th>Rating</th>
            <th>National Park Type</th>
            <th>ParkLocation</th>
            <th>Open/Closed</th>
            <th>Actions</th>
        </tr>

            <!-- For each national park you should have one <tr> like below -->
        <tr th:each="park : ${page.getContent()}" class="item">
            <td th:text="${park.getName()}">[park.name]</td>
            <td th:text="${park.getAreaSize()}">[park.areaSize]</td>
            <td th:text="${park.getRating()}">[park.rating]</td>
            <td th:text="${park.getParkType()}">[park.parkType]</td>
            <td th:text="${park.location.country} + ' ' + ${park.location.continent}">[park.location.country], [park.location.continent]</td>
            <td th:text="${park.isClosed() ? 'CLOSED' : 'OPEN'}">[park.closed] -> OPEN/CLOSED</td>
            <td>
                <!-- NationalParkController.edit -->
                <a th:href="@{'/national-parks/edit/{id}' (id=${park.getId()})}" class="edit-item" sec:authorize="hasRole('ROLE_ADMIN')">Edit</a>

                <!-- NationalParkController.delete -->
                <form method="POST" th:action="@{'/national-parks/delete/{id}' (id=${park.getId()})}" sec:authorize="hasRole('ROLE_ADMIN')">
                    <button type="submit" class="delete-item">Delete</button>
                </form>

                <!-- NationalParkController.close -->
                <form method="POST" th:if="${!park.isClosed()}" th:action="@{'/national-parks/close/{id}' (id=${park.getId()})}" sec:authorize="hasRole('ROLE_ADMIN')">
                    <button type="submit" class="close-item">Close</button>
                </form>

            </td>
        </tr>
    </table>
</div>

<div>
    <ul id="nav">
        <li><a href="/">Home</a></li>
        <li><a href="/login">Login</a></li>
        <li><a href="/logout">Logout</a></li>
    </ul>
</div>

</body>
</html>
