<!DOCTYPE html>
<html lang="en">
<head>
    <title>Archaeological Site Form</title>
</head>
<body>
<!-- The form should submit to ArchaeologicalSiteController.create or ArchaeologicalSiteController.update,
     depending on whether we are creating or editing an archaeological site -->
<form method="POST" th:action="@{${archSite == null ? '/archaeological-sites' : '/archaeological-sites/' + archSite.getId()}}">
    <div>
        <label for="name">Site Name</label>
        <input type="text"
               id="name"
               name="name"
               th:value="${archSite != null && archSite.getName() != null ? archSite.getName() : ''}"
               required>
    </div>

    <div>
        <label for="areaSize">Site Area Size (in square meters)</label>
        <input type="number"
               id="areaSize"
               name="areaSize"
               th:value="${archSite != null && archSite.getAreaSize() != null ? archSite.getAreaSize() : ''}"
               required>
    </div>

    <div>
        <label for="rating">Site Rating</label><br/>
        <input type="number"
               id="rating"
               name="rating"
               step="0.1"
               min="0"
               max="10"
               th:value="${archSite != null ? archSite.getRating() : ''}"
               required>
    </div>

    <div>
        <label for="period">Historical Period</label><br/>
        <select id="period" name="period" size="5" required>
            <!-- For each HistoricalPeriod you should have one <option> like below  -->
            <option th:each="p: ${periods}"
                    th:value="${p}"
                    th:text="${p}"
                    th:selected="${archSite != null && archSite.getPeriod() != null ? archSite.getPeriod() == p : ''}">
            >
        </select>
    </div>

    <div>
        <label for="location">SiteLocation</label><br/>
        <select id="location" name="locationId" required size="5">
            <!-- For each location you should have one <option> like below  -->
            <option th:each="l: ${locations}"
                    th:value="${l.getId()}"
                    th:text="${l.getCity()} + ' ' + ${l.getCountry()}"
                    th:selected="${archSite != null && archSite.getLocation() != null && archSite.getLocation().getId() != null
                                   && archSite.getLocation().getId() == l.getId()}"
            ></option>
        </select>
    </div>

    <button id="submit" type="submit">Submit</button>
    <a id="back" href="/archaeological-sites" type="button" class="btn btn-primary">Back to Archaeological Sites</a>
</form>

<div>
    <ul id="nav">
        <li><a href="/">Home</a></li>
        <li><a href="/login">Login</a></li>
        <li><a href="/logout">Logout</a></li>
    </ul>
</div>
</body>
</html>
