<!DOCTYPE html>
<html lang="en">
<head>
    <title>WP Exam</title>
</head>
<body>
<!-- The form should submit to ExpensesController.create or ExpensesController.update,
     depending on whether we are creating or editing an expense -->
<form method="post" th:action="@{${expense == null ? '/expenses' : '/expenses/' + expense.id}}">
    <div>
        <label for="title">Title</label>
        <input type="text"
               id="title"
               name="title"
               th:value="${expense != null ? expense.getTitle() : ''}"
               required>
    </div>
    <div>
        <label for="dateCreated">Date of Creation</label>
        <input type="date"
               id="dateCreated"
               name="dateCreated"
               th:value="${expense != null ? expense.getDateCreated() : ''}"
               required>
    </div>
    <div>
        <label for="amount">Amount</label>
        <input type="number"
               id="amount"
               name="amount"
               th:value="${expense != null ? expense.getAmount() : ''}"
               required>
    </div>
    <div>
        <label for="daysToExpire">Days to expire</label>
        <input type="number"
               id="daysToExpire"
               name="daysToExpire"
               th:value="${expense != null ? expense.getDaysToExpire() : ''}"
               required>
    </div>
    <div>
        <label for="expenseCategory">Expense Category</label><br/>
        <select id="expenseCategory" name="expenseCategory" multiple="multiple" size="5">
            <!-- For each ExpenseCategory you should have one <option> like below  -->
            <option th:each="c : ${categories}"
                    th:text="${c.name()}"
                    th:value="${c.name()}"
                    th:selected="${expense != null && expense.getExpenseCategory() != null && expense.getExpenseCategory() == c}">
                ></option>
        </select>
    </div>
    <div>
        <label for="vendor">Vendor</label><br/>
        <select id="vendor" name="vendor" multiple="multiple" size="5">
            <!-- For each vendor you should have one <option> like below  -->
            <option th:each="v : ${vendors}"
                    th:text="${v.getName()}"
                    th:value="${v.getId()}"
                    th:selected="${expense != null && expense.getVendor() != null && expense.getVendor().getId() == v.getId()}">
                ></option>
        </select>
    </div>

    <button id="submit" type="submit">Submit</button>
    <a id="back" href="/expenses" type="button" class="btn btn-primary">Back to expenses</a>
</form>

<div>
    <ul id="nav">
        <li><a href="/">Home</a></li>
        <li><a href="/login">Login</a></li>
        <li><a href="/logout">Logout</a></li>
    </ul>
</div>

</body>
</html>
